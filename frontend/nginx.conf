# ИБ-04 (SEC-04): прод-раздача фронта (frontend/dockerfile.prod) — статика сборки Vite и прокси
# /api на бэкенд, один origin (без CORS), как у dev-сервера Vite.
server {
    listen 3000;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Загрузка Excel: лимит бэкенда 10 МБ (dataio/router.py) плюс накладные multipart.
    client_max_body_size 12m;

    # Встроенный DNS Docker; адрес бэкенда разрешается на каждый запрос (через переменную),
    # а не один раз при старте: nginx поднимается, даже если бэкенд ещё не готов, и не теряет
    # его после пересоздания контейнера с новым IP.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $backend_upstream http://backend:8000;

    location /api/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # nginx — край сети: IP клиента перезаписывается, а не дописывается к присланному
        # заголовку, иначе клиент подделал бы свой адрес для анти-брутфорса и журнала (ИБ-10).
        # За доверенным корпоративным прокси — модуль real_ip вместо $remote_addr.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Заключения крупной локальной LLM на CPU считаются минутами — как таймаут прокси Vite.
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    # Хэшированные ассеты сборки неизменяемы — кэш надолго.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        expires max;
        try_files $uri =404;
    }

    # index.html не кэшируется: после выката браузер сразу получает новые ссылки на ассеты.
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        expires -1;
    }

    # Маршруты React Router — на index.html.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
