server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # ИБ-13 (SEC-06): заголовки безопасности для прод-раздачи статики (см. ИБ-04 — переход
    # с dev-сервера Vite на nginx). В прод-сборке inline-скриптов нет — script-src 'self'.
    # Стили antd (CSS-in-JS) inline — style-src 'unsafe-inline' обязателен.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    server_tokens off;

    # Поддержка React Router (перенаправление всех запросов на index.html)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
